[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-hlc-state-delta-replicator"
version = "0.1.0"
description = "Clean-room distributed state delta replicator with Hybrid Logical Clocks (HLC) and Delta-CRDTs."
authors = [{ name = "Ayush Kandwal", email = "ayushkandwal2007@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
chronos = "chronos_hlc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
